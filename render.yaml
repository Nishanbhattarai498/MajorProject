services:
  - type: web
    name: neuroscope-model-api
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements-app-api.txt
    startCommand: uvicorn backend.model_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_NAME
        value: swin_tiny_patch4_window7_224
      - key: MODEL_CHECKPOINT_URL
        sync: false

  - type: web
    name: neuroscope-api
    runtime: node
    rootDir: backend/node-api
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MODEL_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false